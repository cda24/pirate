[project]
authors = [{name = "C. D. Armstrong", email = "chris.armstrong@stfc.ac.uk"}]
dependencies = ["numpy>=2.4.4", 
                "matplotlib>=3.10.9", 
                "pytest>=9.0.3", 
                "jupyter>=1.1.1"]
name = "pirate"
requires-python = ">= 3.11"
version = "0.2"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
pirate = { path = ".", editable = true }

[tool.pixi.tasks]
